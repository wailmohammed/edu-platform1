name: Security Checks

on:
  push:
    branches:
      - main
      - mint-arrow
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run security audit
        run: pnpm audit --audit-level=high
      - name: Typecheck
        run: pnpm check
      - name: Run tests
        run: pnpm test
